<text x="56.0" y="231.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Dequeue just advances head (returns 1). Enqueue 4,5,6: the tail hits the end and</text>
<text x="56.0" y="250.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">WRAPS — index arithmetic mod capacity.</text>
