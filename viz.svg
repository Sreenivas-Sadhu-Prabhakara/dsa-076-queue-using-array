<text x="56.0" y="383.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Both operations O(1), fixed memory. The classic trap: head==tail means empty OR full</text>
<text x="56.0" y="402.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">— resolved by tracking the count separately.</text>
